
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b12">
  <title>Connexion | MADARA TOP UP</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: radial-gradient(ellipse at top, #06313c, #080b12 65%);
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: #111925;
      border: 1px solid #233447;
      border-radius: 18px;
      padding: 30px 24px;
    }
    .login-card h1 {
      font-size: 27px;
      margin: 25px 0 10px;
    }
    .subtitle {
      color: #9aa8b8;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 25px;
    }
    .field {
      margin-bottom: 18px;
    }
    .field label {
      display: block;
      font-size: 13px;
      margin-bottom: 9px;
    }
    .field input {
      width: 100%;
      padding: 15px;
      background: #080b12;
      border: 1px solid #304052;
      border-radius: 9px;
      color: white;
      outline: none;
      font-size: 14px;
    }
    .field input:focus {
      border-color: #00e5ff;
    }
    .submit-btn, .google-btn {
      display: block;
      width: 100%;
      padding: 15px;
      border-radius: 9px;
      text-align: center;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }
    .submit-btn {
      border: 0;
      background: #00e5ff;
      color: #061018;
      margin-top: 8px;
    }
    .google-btn {
      background: white;
      color: #151515;
      margin-top: 18px;
    }
    .separator {
      color: #9aa8b8;
      text-align: center;
      margin: 22px 0;
      font-size: 12px;
    }
    .back-link {
      display: block;
      text-align: center;
      color: #00e5ff;
      font-size: 13px;
      margin-top: 22px;
    }
    .notice {
      color: #9aa8b8;
      font-size: 11px;
      line-height: 1.6;
      margin-top: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <main class="login-card">
    <a href="index.html" class="logo">
      MADARA <span>TOP UP</span>
    </a>

    <h1>Bienvenue !</h1>
    <p class="subtitle">
      Connecte-toi pour accéder à ta boutique de recharge Free Fire.
    </p>

    <form action="/api/auth/login" method="POST">
      <div class="field">
        <label for="email">Adresse Gmail ou email</label>
        <input
          id="email"
          name="email"
          type="email"
          placeholder="exemple@gmail.com"
          autocomplete="username"
          required
        >
      </div>

      <div class="field">
        <label for="password">Mot de passe MADARA</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="Ton mot de passe"
          autocomplete="current-password"
          minlength="8"
          required
        >
      </div>

      <button class="submit-btn" type="submit">
        SE CONNECTER →
      </button>
    </form>

    <div class="separator">OU CONTINUER AVEC</div>

    <a class="google-btn" href="/api/auth/google">
      G — Continuer avec Google
    </a>

    <a class="back-link" href="index.html">
      ← Retour à l'accueil
    </a>

    <p class="notice">
      Connexion sécurisée. MADARA TOP UP ne demande jamais
      ton mot de passe Gmail.
    </p>
  </main>

</body>
</html>
